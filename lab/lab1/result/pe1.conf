system {
    host-name pe1;
    root-authentication {
		encrypted-password "$1$p9kxpD/8$A8Qnf/aZfqdQIznOak8g80"; ## SECRET-DATA
    }
    login {
        user admin {
            class super-user;
            authentication {
				encrypted-password "$1$p9kxpD/8$A8Qnf/aZfqdQIznOak8g80"; ## SECRET-DATA
                ssh-rsa "ssh-rsa  irzan@nuc1";
                }
        }
    }
    services {
        ssh {
            root-login allow;
            sftp-server;
        }
        netconf {
            ssh;
        }
    }
    arp {
        aging-timer 5;
    }
    management-instance;
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
chassis {
    evpn-vxlan-default-switch-support;
    network-services enhanced-ip;
}

interfaces {
    delete: fxp0;
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.250.11/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family {
            inet {
                    address 10.1.255.1;
                }
            inet6 {
                    address fc00:dead:beef:ffff::1;
                }
                iso {
                    address 49.0001.0001.0001.00;
                }
                }
        }
        }
    ge-0/0/0 {
        }
    ge-0/0/1 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.0/31;
                }
            inet6 {
                    address fc00:dead:beef:ffff:ffff::0/127;
                }
                iso;
                }
        }
        }
    ge-0/0/2 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.2/31;
                }
            inet6 {
                    address fc00:dead:beef:ffff:ffff::2/127;
                }
                iso;
                }
        }
        }
    }
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 192.168.250.254;
            }
        }
    }
}
protocols {
    lldp {
        interface all;
        interface fxp0 {
            disable;
        }
        }

    isis {
        level 1 disable;
        level 2 wide-metrics-only;
        interface lo0.0 {
            passive;
        }
        
        
        interface ge-0/0/1 {
            point-to-point;
        }
        
        interface ge-0/0/2 {
            point-to-point;
        }
        }
    
}


