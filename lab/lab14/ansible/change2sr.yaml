- name: change the router configuration
  hosts: all
  connection: local
  gather_facts: no
  vars:
    user: admin
  tasks:
    - name: change to SR
      juniper.device.config:  
        template: to_sr.j2
        format: set
        load: merge
        vars: "{{ lookup('file', playbook_dir + '/vars_' + inventory_hostname + '.yaml') | from_yaml}}"
