system {
    host-name fw2;
    root-authentication {
		encrypted-password "$1$S8O3V3Mk$inWQ/UkNq3HvnOz.Qh7Tu1"; ## SECRET-DATA
    }
    login {
        user admin {
            class super-user;
            authentication {
				encrypted-password "$1$S8O3V3Mk$inWQ/UkNq3HvnOz.Qh7Tu1"; ## SECRET-DATA
                ssh-rsa "ssh-rsa  irzan@nuc1";
                }
        }
    }
    services {
        ssh {
            root-login allow;
            sftp-server;
        }
        netconf {
            ssh;
        }
    }
    arp {
        aging-timer 5;
    }
    management-instance;
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
system {
	license {
        autoupdate {
            url https://ae1.juniper.net/junos/key_retrieval;
        }
    }
}
security {
	pki {
        ca-profile ISRG_Root_X1 {
            ca-identity ISRG_Root_X1;
            pre-load;
        }
        ca-profile Lets_Encrypt {
            ca-identity Lets_Encrypt;
            enrollment {
                url https://acme-v02.api.letsencrypt.org/directory;
            }
        }
    }
    screen {
        ids-option untrust-screen {
            icmp {
                ping-death;
            }
            ip {
                source-route-option;
                tear-drop;
            }
            tcp {
                syn-flood {
                    alarm-threshold 1024;
                    attack-threshold 200;
                    source-threshold 1024;
                    destination-threshold 2048;
                    queue-size 2000; ## Warning: 'queue-size' is deprecated
                    timeout 20;
                }
                land;
            }
        }
    }
	zones {
        security-zone trust {
            tcp-rst;
        }
        security-zone untrust {
            screen untrust-screen;
        }
    }
	policies {
        from-zone trust to-zone trust {
            policy default-permit {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone trust to-zone untrust {
            policy default-permit {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        pre-id-default-policy {
            then {
                log {
                    session-close;
                }
            }
        }
    }
}
interfaces {
    delete: fxp0;
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.250.22/24;
            }
        }
    }
    ge-0/0/0 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.7/31;
                }
            }
        }
        }
    ge-0/0/1 {
        mtu 9014;
        unit 0 {
            family {
            inet {
                    address 10.1.100.9/31;
                }
            }
        }
        }
    ge-0/0/2 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.11/31;
                }
            }
        }
        }
    ge-0/0/3 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.13/31;
                }
            }
        }
        }
    lo0 {
        unit 0 {
            family {
            inet {
                    address 10.1.255.12/32;
                }
            }
        }
        }
    }
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 192.168.250.254;
            }
        }
    }
}
protocols {
    lldp {
        interface all;
        interface fxp0 {
            disable;
        }
        }

    ospf {
        area 0.0.0.0 {
            
            interface ge-0/0/0 {
                interface-type p2p;
				bfd-liveness-detection {
                	minimum-interval 500;
                	multiplier 3;
                	full-neighbors-only;
            	}
            }
            
            interface ge-0/0/1 {
                interface-type p2p;
				bfd-liveness-detection {
                	minimum-interval 500;
                	multiplier 3;
                	full-neighbors-only;
            	}
            }
            
            interface ge-0/0/2 {
                interface-type p2p;
				bfd-liveness-detection {
                	minimum-interval 500;
                	multiplier 3;
                	full-neighbors-only;
            	}
            }
            
            interface ge-0/0/3 {
                interface-type p2p;
				bfd-liveness-detection {
                	minimum-interval 500;
                	multiplier 3;
                	full-neighbors-only;
            	}
            }
            interface lo0.0 {
                passive;
            }
            
        }
    }
    
}


