hostname sw2
user admin group administrators password plaintext pass01
user admin authorized-key ssh-rsa  irzan@nuc1
!
ssh public-key-authentication
no ntp enable
ssh server vrf mgmt
vlan 1
!
bfd
bfd min-transmit-interval 500
bfd detect-multiplier 3
!
interface mgmt
    no shutdown
    ip static 192.168.250.12/24
https-server vrf mgmt
router ospf 1 
    router-id 10.1.255.2
    area 0.0.0.0
	bfd all-interfaces

interface 1/1/1

    no shutdown
    

interface 1/1/2

    no shutdown
    mtu 9000
    ip mtu 9000
    ip address 10.1.100.2/31
    ip ospf 1 area 0.0.0.0
    ip ospf network point-to-point
    

interface 1/1/3

    no shutdown
    mtu 9000
    ip mtu 9000
    ip address 10.1.100.8/31
    ip ospf 1 area 0.0.0.0
    ip ospf network point-to-point
    
interface loopback 0

    ip address 10.1.255.2/32
    ip ospf 1 area 0.0.0.0 
    
