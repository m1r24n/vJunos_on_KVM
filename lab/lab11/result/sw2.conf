system {
    host-name sw2;
    root-authentication {
		encrypted-password "$1$PvHKoh1O$xCvv5DxC2P9xEPfug0OvJ0"; ## SECRET-DATA
    }
    login {
        user admin {
            class super-user;
            authentication {
				encrypted-password "$1$PvHKoh1O$xCvv5DxC2P9xEPfug0OvJ0"; ## SECRET-DATA
                ssh-rsa "ssh-rsa  irzan@nuc1";
                }
        }
    }
    services {
        ssh {
            root-login allow;
            sftp-server;
        }
        netconf {
            ssh;
        }
    }
    arp {
        aging-timer 5;
    }
    management-instance;
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
chassis {
    evpn-vxlan-default-switch-support;
    network-services enhanced-ip;
}

interfaces {
    delete: fxp0;
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.250.12/24;
            }
        }
    }
    ge-0/0/0 {
        }
    ge-0/0/1 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.2/31;
                }
            }
        }
        }
    ge-0/0/2 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.6/31;
                }
            }
        }
        }
    lo0 {
        unit 0 {
            family {
            inet {
                    address 10.1.255.2/32;
                }
            }
        }
        }
    }
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 192.168.250.254;
            }
        }
    }
}
protocols {
    lldp {
        interface all;
        interface fxp0 {
            disable;
        }
        }

    ospf {
        area 0.0.0.0 {
            
            
            interface ge-0/0/1 {
                interface-type p2p;
				bfd-liveness-detection {
                	minimum-interval 500;
                	multiplier 3;
                	full-neighbors-only;
            	}
            }
            
            interface ge-0/0/2 {
                interface-type p2p;
				bfd-liveness-detection {
                	minimum-interval 500;
                	multiplier 3;
                	full-neighbors-only;
            	}
            }
            interface lo0.0 {
                passive;
            }
            
        }
    }
    
}


