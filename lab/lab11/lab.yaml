---
disk: 
  vjunosrouter: /vm/images/vJunos-router-25.4R1.12.qcow2
  vjunosswitch: /vm/images/vJunos-switch-25.4R1.12.qcow2
  vjunosevolved: /vm/images/vJunosEvolved-25.4R1.13-EVO.qcow2
  vaoscx: /vm/images/arubaoscx.qcow2
  vsrx: /vm/images/junos-vsrx3-x86-64-25.4R1.12.qcow2
  vsrx_config: /vm/images/vsrx_config.iso
  #vjunosevolved: /disk3/vjunos/vJunosEvolved-24.2R2.6-EVO.qcow2
  #vjunosevolvedbx: /disk3/vjunos/
  #vjunosevolved_config: /disk3/vjunos/vjunosevolved_config.img
vm_dir: /vm/lab11
mgmt:
  bridge: br0
ovs:
- sw1_ge0
- sw2_ge1
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.1
    max: 192.168.250.200
fabric:
  ipv4_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [sw1,ge-0/0/1,fw1,ge-0/0/0,0x11]
  - [sw2,1/1/2,fw1,ge-0/0/1,0x11]
  - [sw1,ge-0/0/2,fw2,ge-0/0/0,0x11]
  - [sw2,1/1/3,fw2,ge-0/0/1,0x11]
  - [fw1,ge-0/0/2,fw2,ge-0/0/2,0x11]
vm:
  sw1:
    type: vjunosswitch
    ip_address: 192.168.250.11
    port:
      lo0:
        inet: 10.1.255.1/32
      ge-0/0/0: 
        bridge: sw1_ge0
  sw2:
    type: vaoscx
    ip_address: 192.168.250.12
    port:
      lo0:
        inet: 10.1.255.2/32
      1/1/1: 
        bridge: sw2_ge1
  fw1:
    type: vsrx
    ip_address: 192.168.250.13
    port:
      lo0:
        inet: 10.1.255.11/32
  fw2:
    type: vsrx
    ip_address: 192.168.250.14
    port:
      lo0:
        inet: 10.1.255.12/32
lxc:
  cl1sw1:
    type: client
    port:
      eth0:
        bridge: sw1_ge0
        vlan: 111
        inet: 192.168.111.11/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a111::1000:11/64
        gw6: fc00:dead:Beef:a111::1
  cl2sw1:
    type: client
    port:
      eth0:
        bridge: sw1_ge0
        vlan: 112
        inet: 192.168.112.11/24
        gw4: 192.168.112.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a112::1000:11/64
        gw6: fc00:dead:Beef:a112::1
  cl1sw2:
    type: client
    port:
      eth0:
        bridge: sw2_ge1
        vlan: 121
        inet: 192.168.121.11/24
        gw4: 192.168.121.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a121::1000:11/64
        gw6: fc00:dead:Beef:a121::1
  cl2sw2:
    type: client
    port:
      eth0:
        bridge: sw2_ge1
        vlan: 122
        inet: 192.168.122.11/24
        gw4: 192.168.122.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a122::1000:11/64
        gw6: fc00:dead:Beef:a122::1
  

