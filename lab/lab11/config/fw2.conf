version 25.4R1.12;
groups {
    mnha-sync {
        when {
            peers [ fw1 fw2 ];
        }
        security {
            policies {
                from-zone trust to-zone trust {
                    policy default-permit {
                        match {
                            source-address any;
                            destination-address any;
                            application any;
                        }
                        then {
                            permit;
                        }
                    }
                }
                from-zone trust to-zone untrust {
                    policy default-permit {
                        match {
                            source-address any;
                            destination-address any;
                            application any;
                        }
                        then {
                            permit;
                        }
                    }
                }
                from-zone untrust to-zone trust {
                    policy permit1 {
                        match {
                            source-address cl3sw2;
                            destination-address cl2sw1;
                            application [ junos-ping junos-ssh ];
                        }
                        then {
                            permit;
                            log {
                                session-init;
                            }
                            count;
                        }
                    }
                    policy default {
                        match {
                            source-address any;
                            destination-address any;
                            application any;
                        }
                        then {
                            reject;
                            log {
                                session-init;
                            }
                            count;
                        }
                    }
                }
                pre-id-default-policy {
                    then {
                        log {
                            session-close;
                        }
                    }
                }
            }
            address-book {
                global {
                    address cl3sw2 192.168.121.13/32;
                    address cl2sw1 192.168.112.11/32;
                }
            }
        }
    }
}
apply-groups mnha-sync;
