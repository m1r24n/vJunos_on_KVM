---
disk: 
  vjunosrouter: /vm/images/vJunos-router-25.4R1.12.qcow2
  vjunosswitch: /vm/images/vJunos-switch-25.4R1.12.qcow2
  vaoscx: /vm/images/arubaoscx-disk-image.qcow2
  sonic: /vm/images/sonic-vm.qcow2
vm_dir: /vm/lab8
mgmt:
  bridge: br0
ovs:
- r1_ge0
- r3_ge0
- r4_ge0
- r5_ge0
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.100
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [r1,ge-0/0/1,r2,ge-0/0/0,0xf]
  - [r1,ge-0/0/2,r2,ge-0/0/1,0xf]
  - [r2,ge-0/0/2,r3,ge-0/0/1,0xf]
  - [r2,ge-0/0/3,r3,ge-0/0/2,0xf]
  - [r1,ge-0/0/3,r4,ge-0/0/1,0xf]
  - [r3,ge-0/0/3,r4,ge-0/0/2,0xf]
  - [r1,ge-0/0/4,r5,ge-0/0/1,0xf]
  - [r3,ge-0/0/4,r5,ge-0/0/2,0xf]
vm:
  r1:
    type: vjunosrouter
    ip_address: 192.168.250.101
    port:
      lo0:
        inet: 10.1.255.1/32
        inet6: fc00:dead:beef:ffff::1/128
        iso: 49.0001.0001.0001.0001.00
      ge-0/0/0: 
        bridge: r1_ge0
  r2:
    type: vjunosrouter
    ip_address: 192.168.250.102
    port:
      lo0:
        inet: 10.1.255.2/32
        inet6: fc00:dead:beef:ffff::2/128
        iso: 49.0001.0001.0001.0002.00
  r3:
    type: vjunosrouter
    ip_address: 192.168.250.103
    port:
      lo0:
        inet: 10.1.255.3/32
        inet6: fc00:dead:beef:ffff::3/128
        iso: 49.0001.0001.0001.0003.00
      ge-0/0/0: 
        bridge: r3_ge0
  r4:
    type: vjunosrouter
    ip_address: 192.168.250.104
    port:
      lo0:
        inet: 10.1.255.4/32
        inet6: fc00:dead:beef:ffff::4/128
        iso: 49.0001.0001.0001.0004.00
      ge-0/0/0: 
        bridge: r4_ge0
  r5:
    type: vjunosrouter
    ip_address: 192.168.250.105
    port:
      lo0:
        inet: 10.1.255.5/32
        inet6: fc00:dead:beef:ffff::5/128
        iso: 49.0001.0001.0001.0004.00
      ge-0/0/0: 
        bridge: r5_ge0
lxc:
  c1:
    type: alpine
    port:
      eth0:
        bridge: r1_ge0
        vlan: 111
        inet: 192.168.111.11/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a111::1000:11/64
        gw6: fc00:dead:Beef:a111::1
  c3:
    type: alpine
    port:
      eth0:
        bridge: r3_ge0
        vlan: 113
        inet: 192.168.113.11/24
        gw4: 192.168.113.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a113::1000:11/64
        gw6: fc00:dead:Beef:a113::1
  c5:
    type: alpine
    port:
      eth0:
        bridge: r5_ge0
        vlan: 115
        inet: 192.168.115.11/24
        gw4: 192.168.115.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a115::1000:11/64
        gw6: fc00:dead:Beef:a115::1
