---
disk: 
  vjunosrouter: /disk2/vm/images/vJunos-router-26.2R1.7.qcow2
  vjunosswitch: /disk2/vm/images/vJunos-switch-26.2R1.7.qcow2
  # vaoscx: /disk2/vm/images/arubaoscx-disk-image.qcow2
  # sonic: /disk2/vm/images/sonic-vm.qcow2
vm_dir: /disk2/vm/topo1
mgmt:
  bridge: br0
ovs:
- pe1_ge0
- pe2_ge0
- pe3_ge0
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.100
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [pe1,ge-0/0/1,p1,ge-0/0/0,0x1cd]
  - [pe1,ge-0/0/2,p2,ge-0/0/0,0x1cd]
  - [pe2,ge-0/0/1,p1,ge-0/0/1,0x1cd]
  - [pe2,ge-0/0/2,p2,ge-0/0/1,0x1cd]
  - [pe3,ge-0/0/1,p1,ge-0/0/2,0x1cd]
  - [pe3,ge-0/0/2,p2,ge-0/0/2,0x1cd]
  - [p1,ge-0/0/3,p2,ge-0/0/3,0x1cd]
  - [p1,ge-0/0/4,p2,ge-0/0/4,0x1cd]
vm:
  pe1:
    type: vjunosrouter
    ip_address: 192.168.250.101
    port:
      lo0:
        inet: 10.1.255.1/32
        iso: 49.0001.0001.0001.0001.00
      ge-0/0/0: 
        bridge: pe1_ge0
  pe2:
    type: vjunosrouter
    ip_address: 192.168.250.102
    port:
      lo0:
        inet: 10.1.255.2/32
        iso: 49.0001.0001.0001.0002.00
      ge-0/0/0: 
        bridge: pe2_ge0
  pe3:
    type: vjunosrouter
    ip_address: 192.168.250.103
    port:
      lo0:
        inet: 10.1.255.3/32
        iso: 49.0001.0001.0001.0003.00
      ge-0/0/0: 
        bridge: pe3_ge0
  p1:
    type: vjunosrouter
    ip_address: 192.168.250.111
    port:
      lo0:
        inet: 10.1.255.11/32
        iso: 49.0001.0001.0001.0011.00
  p2:
    type: vjunosrouter
    ip_address: 192.168.250.112
    port:
      lo0:
        inet: 10.1.255.12/32
        iso: 49.0001.0001.0001.0012.00
lxc:
  c1evpn1:
    type: alpine
    port:
      eth0:
        bridge: pe1_ge0
        vlan: 1001
        inet: 172.16.100.1/24
        gw4: 172.16.100.254
        inet6: fc00:dead:beef:a100::1000:1/64
        gw6: fc00:dead:beef:a100::1
  c2evpn1:
    type: alpine
    port:
      eth0:
        bridge: pe2_ge0
        vlan: 1001
        inet: 172.16.100.2/24
        gw4: 172.16.100.254
        inet6: fc00:dead:beef:a100::1000:2/64
        gw6: fc00:dead:beef:a100::1
  c3evpn1:
    type: alpine
    port:
      eth0:
        bridge: pe3_ge0
        vlan: 1001
        inet: 172.16.100.3/24
        gw4: 172.16.100.254
        inet6: fc00:dead:beef:a100::1000:3/64
        gw6: fc00:dead:beef:a100::1
    