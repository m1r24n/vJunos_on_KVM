---
disk: 
  vjunosrouter: /vm/images/vJunos-router-25.4R1.12.qcow2
  vjunosswitch: /vm/images/vJunos-switch-25.4R1.12.qcow2
  vjunosevolved: /vm/images/vJunosEvolved-25.4R1.13-EVO.qcow2
  vaoscx: /vm/images/arubaoscx.qcow2
  #vjunosevolved: /disk3/vjunos/vJunosEvolved-24.2R2.6-EVO.qcow2
  #vjunosevolvedbx: /disk3/vjunos/
  #vjunosevolved_config: /disk3/vjunos/vjunosevolved_config.img
vm_dir: /vm/lab6
mgmt:
  bridge: br0
ovs:
- sw1_ge4
- sw2_ge4
- sw5_ge4
- sw6_ge4
- sw1_ge5
- sw2_ge5
- sw5_ge5
- sw6_ge5
- sw1_ge6
- sw2_ge6
- sw5_ge6
- sw6_ge6
- sw3_ge5
- sw4_ge5
- sw3_ge6
- sw4_ge6
- sw3_ge7
- sw4_ge7
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.1
    max: 192.168.250.200
fabric:
  ipv4_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [sw1,ge-0/0/0,sw2,ge-0/0/0,0x11]
  - [sw1,ge-0/0/1,sw2,ge-0/0/1,0x11]
  - [sw3,1/1/1,sw4,1/1/1,0x11]
  - [sw3,1/1/2,sw4,1/1/2,0x11]
  - [sw5,ge-0/0/0,sw6,ge-0/0/0,0x11]
  - [sw5,ge-0/0/1,sw6,ge-0/0/1,0x11]
  - [sw1,ge-0/0/2,c1,ge-0/0/0,0x11]
  - [sw1,ge-0/0/3,c2,ge-0/0/0,0x11]
  - [sw2,ge-0/0/2,c1,ge-0/0/1,0x11]
  - [sw2,ge-0/0/3,c2,ge-0/0/1,0x11]
  - [sw3,1/1/3,c1,ge-0/0/2,0x11]
  - [sw3,1/1/4,c2,ge-0/0/2,0x11]
  - [sw4,1/1/3,c1,ge-0/0/3,0x11]
  - [sw4,1/1/4,c2,ge-0/0/3,0x11]
  - [sw5,ge-0/0/2,c1,ge-0/0/4,0x11]
  - [sw5,ge-0/0/3,c2,ge-0/0/4,0x11]
  - [sw6,ge-0/0/2,c1,ge-0/0/5,0x11]
  - [sw6,ge-0/0/3,c2,ge-0/0/5,0x11]
  - [c1,ge-0/0/6,c2,ge-0/0/6,0x11]
  - [c1,ge-0/0/7,c2,ge-0/0/7,0x11]
vm:
  sw1:
    type: vjunosswitch
    ip_address: 192.168.250.11
    port:
      lo0:
        inet: 10.1.255.1/32
      ge-0/0/4: 
        bridge: sw1_ge4
      ge-0/0/5: 
        bridge: sw1_ge5
      ge-0/0/6: 
        bridge: sw1_ge6
  sw2:
    type: vjunosswitch
    ip_address: 192.168.250.12
    port:
      lo0:
        inet: 10.1.255.2/32
      ge-0/0/4: 
        bridge: sw2_ge4
      ge-0/0/5: 
        bridge: sw2_ge5
      ge-0/0/6: 
        bridge: sw2_ge6
  sw3:
    type: vaoscx
    ip_address: 192.168.250.13
    port:
      lo0:
        inet: 10.1.255.3/32
      1/1/5: 
        bridge: sw3_ge5
      1/1/6: 
        bridge: sw3_ge6
      1/1/7: 
        bridge: sw3_ge7
  sw4:
    type: vaoscx
    ip_address: 192.168.250.14
    port:
      lo0:
        inet: 10.1.255.4/32
      1/1/5: 
        bridge: sw4_ge5
      1/1/6: 
        bridge: sw4_ge6
      1/1/7:
        bridge: sw4_ge7
  sw5:
    type: vjunosswitch
    ip_address: 192.168.250.5
    port:
      lo0:
        inet: 10.1.255.5/32
      ge-0/0/4: 
        bridge: sw5_ge4
      ge-0/0/5: 
        bridge: sw5_ge5
      ge-0/0/6: 
        bridge: sw5_ge6
  sw6:
    type: vjunosswitch
    ip_address: 192.168.250.6
    port:
      lo0:
        inet: 10.1.255.6/32
      ge-0/0/4: 
        bridge: sw6_ge4
      ge-0/0/5: 
        bridge: sw6_ge5
      ge-0/0/6: 
        bridge: sw6_ge6
  c1:
    type: vjunosrouter
    ip_address: 192.168.250.15
    port:
      lo0:
        inet: 10.1.255.11/32
  c2:
    type: vjunosrouter
    ip_address: 192.168.250.16
    port:
      lo0:
        inet: 10.1.255.12/32
  
