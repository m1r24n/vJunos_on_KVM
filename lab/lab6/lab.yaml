---
disk: 
  vjunosrouter: /disk2/vm/images/vJunos-router-25.4R1.12.qcow2
  vjunosswitch: /disk2/vm/images/vJunos-switch-25.4R1.12.qcow2
  vjunosevolved: /disk2/vm/images/vJunosEvolved-25.4R1.13-EVO.qcow2
  vaoscx: /disk2/vm/images/arubaoscx.qcow2
  #vjunosevolved: /disk3/vjunos/vJunosEvolved-24.2R2.6-EVO.qcow2
  #vjunosevolvedbx: /disk3/vjunos/
  #vjunosevolved_config: /disk3/vjunos/vjunosevolved_config.img
vm_dir: /disk2/vm/lab6
mgmt:
  bridge: br0
ovs:
- sw1_ge4
- sw2_ge4
- sw1_ge5
- sw2_ge5
- sw3_em5
- sw4_em5
- sw3_em6
- sw4_em6
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.1
    max: 192.168.250.200
fabric:
  ipv4_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [sw1,ge-0/0/0,sw2,ge-0/0/0,0x0]
  - [sw1,ge-0/0/1,sw2,ge-0/0/1,0x0]
  - [sw3,em1,sw4,em1,0x0]
  - [sw3,em2,sw4,em2,0x0]
  - [sw1,ge-0/0/2,c1,ge-0/0/0,0x0]
  - [sw1,ge-0/0/3,c2,ge-0/0/0,0x0]
  - [sw2,ge-0/0/2,c1,ge-0/0/1,0x0]
  - [sw2,ge-0/0/3,c2,ge-0/0/1,0x0]
  - [sw3,em3,c1,ge-0/0/2,0x0]
  - [sw3,em4,c2,ge-0/0/2,0x0]
  - [sw4,em3,c1,ge-0/0/3,0x0]
  - [sw4,em4,c2,ge-0/0/3,0x0]
  - [c1,ge-0/0/4,c2,ge-0/0/4,0x0]
  - [c2,ge-0/0/5,c2,ge-0/0/5,0x0]
vm:
  sw1:
    type: vjunosswitch
    ip_address: 192.168.250.11
    port:
      ge-0/0/4: 
        bridge: sw1_ge4
      ge-0/0/5: 
        bridge: sw1_ge5
      ge-0/0/6: 
        bridge: sw1_ge6
  sw2:
    type: vjunosswitch
    ip_address: 192.168.250.12
    port:
      ge-0/0/4: 
        bridge: sw2_ge4
      ge-0/0/5: 
        bridge: sw2_ge5
      ge-0/0/6: 
        bridge: sw2_ge6
  sw3:
    type: vaoscx
    ip_address: 192.168.250.13
    port:
      em5: 
        bridge: sw3_em5
      em6: 
        bridge: sw3_em6
      em7: 
        bridge: sw3_em6
  sw4:
    type: vaoscx
    ip_address: 192.168.250.14
    port:
      em5: 
        bridge: sw4_em5
      em6: 
        bridge: sw4_em6
      em7: 
        bridge: sw4_em6
  c1:
    type: vjunosrouter
    ip_address: 192.168.250.15
    port: {}
  c2:
    type: vjunosrouter
    ip_address: 192.168.250.16
    port: {}
  