vm_dir: /disk2/vm/lab6
mgmt:
  bridge: br0
ovs:
- sw1_ge4
- sw2_ge4
- sw5_ge2
- sw1_ge5
- sw2_ge5
- sw5_ge3
- sw1_ge6
- sw2_ge6
- sw5_ge4
- sw3_ge5
- sw4_ge5
- sw3_ge6
- sw4_ge6
- sw3_ge7
- sw4_ge7
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
