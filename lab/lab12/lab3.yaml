---
# with aoscx and junos
disk: 
  linuxrouter: /vm/images/linuxrouter.qcow2
vm_dir: /vm/lab12
config_dir: configdir
mgmt:
  bridge: br0
ovs:
- leaf1_ge1
- leaf2_ge1
- leaf3_ge1
- leaf4_ge1
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.1
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #inet6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [leaf1,eth2,core1,eth1,0xf]
  - [leaf1,eth3,core2,eth1,0xf]
  - [leaf2,eth2,core1,eth2,0xf]
  - [leaf2,eth3,core2,eth2,0xf]
  - [leaf3,eth2,core1,eth3,0xf]
  - [leaf3,eth3,core2,eth3,0xf]
  - [leaf4,eth2,core1,eth4,0xf]
  - [leaf4,eth3,core2,eth4,0xf]
vm:
  leaf1:
    type: linuxrouter
    ip_address: 192.168.250.11
    port:
      lo0:
        inet: 10.1.255.1/32
        inet6: fc00:dead:Beef:ffff::1/128
        iso: 49.0001.0001.0001.00
      eth1: 
        bridge: leaf1_ge1
  leaf2:
    type: linuxrouter
    ip_address: 192.168.250.12
    port:
      lo0:
        inet: 10.1.255.2/32
        inet6: fc00:dead:Beef:ffff::2/128
        iso: 49.0001.0001.0002.00
      eth1: 
        bridge: leaf2_ge1
  leaf3:
    type: linuxrouter
    ip_address: 192.168.250.13
    port:
      lo0:
        inet: 10.1.255.3/32
        inet6: fc00:dead:Beef:ffff::3/128
        iso: 49.0001.0001.0003.00
      eth1: 
        bridge: leaf3_ge1
  leaf4:
    type: linuxrouter
    ip_address: 192.168.250.14
    port:
      lo0:
        inet: 10.1.255.4/32
        inet6: fc00:dead:Beef:ffff::4/128
        iso: 49.0001.0001.0004.00
      eth1: 
        bridge: leaf4_ge1
  core1:
    type: linuxrouter
    ip_address: 192.168.250.21
    port:
      lo0:
        inet: 10.1.255.11/32
        inet6: fc00:dead:Beef:ffff::11/128
        iso: 49.0001.0001.0011.00
  core2:
    type: linuxrouter
    ip_address: 192.168.250.22
    port:
      lo0:
        inet: 10.1.255.12/32
        inet6: fc00:dead:Beef:ffff::12/128
        iso: 49.0001.0001.0012.00
lxc:
  cl1leaf1:
    type: alpine
    port:
      eth0:
        bridge: leaf1_ge1
        vlan: 111
        inet: 192.168.111.11/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a111::1000:11/64
        gw6: fc00:dead:Beef:a111::1
  cl2leaf1:
    type: alpine
    port:
      eth0:
        bridge: leaf1_ge1
        vlan: 111
        inet: 192.168.111.12/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a112::1000:12/64
        gw6: fc00:dead:Beef:a112::1
  cl1leaf3:
    type: alpine
    port:
      eth0:
        bridge: leaf3_ge1
        vlan: 111
        inet: 192.168.111.13/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a111::1000:11/64
        gw6: fc00:dead:Beef:a111::1
  cl2leaf3:
    type: alpine
    port:
      eth0:
        bridge: leaf3_ge1
        vlan: 112
        inet: 192.168.111.13/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a112::1000:12/64
        gw6: fc00:dead:Beef:a112::1
  cl1leaf2:
    type: alpine
    port:
      eth0:
        bridge: leaf2_ge1
        vlan: 121
        inet: 192.168.121.11/24
        gw4: 192.168.121.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a121::1000:11/64
        gw6: fc00:dead:Beef:a121::1
  cl2leaf2:
    type: alpine
    port:
      eth0:
        bridge: leaf2_ge1
        vlan: 121
        inet: 192.168.121.12/24
        gw4: 192.168.121.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a121::1000:12/64
        gw6: fc00:dead:Beef:a121::1
  cl1leaf4:
    type: alpine
    port:
      eth0:
        bridge: leaf4_ge1
        vlan: 121
        inet: 192.168.121.13/24
        gw4: 192.168.121.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a121::1000:13/64
        gw6: fc00:dead:Beef:a121::1
  cl2leaf4:
    type: alpine
    port:
      eth0:
        bridge: leaf4_ge1
        vlan: 121
        inet: 192.168.121.14/24
        gw4: 192.168.121.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a121::1000:14/64
        gw6: fc00:dead:Beef:a121::1
  
  
  