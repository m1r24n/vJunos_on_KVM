---
# with aoscx and junos
disk: 
  vjunosrouter: /vm/images/vJunos-router-25.4leaf1.12.qcow2
  vjunosswitch: /vm/images/vJunos-switch-25.4leaf1.12.qcow2
  vjunosevolved: /vm/images/vJunosEvolved-25.4leaf1.13-EVO.qcow2
  vaoscx: /vm/images/aoscx_10.18.qcow2
  vsrx: /vm/images/junos-vsrx3-x86-64-25.4leaf1.12.qcow2
  linuxrouter: /vm/images/linuxrouter.qcow2
  # vsrx_config: /vm/images/vsrx_config.iso
  #vjunosevolved: /disk3/vjunos/vJunosEvolved-24.2leaf2.6-EVO.qcow2
  #vjunosevolvedbx: /disk3/vjunos/
  #vjunosevolved_config: /disk3/vjunos/vjunosevolved_config.img
vm_dir: /vm/lab12
config_dir: configdir
mgmt:
  bridge: br0
ovs:
- leaf1_ge0
- leaf2_ge0
- leaf3_ge0
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.1
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #inet6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [leaf1,eth2,core1,eth1,0xf]
  - [leaf1,eth3,core2,eth1,0xf]
  - [leaf2,eth2,core1,eth2,0xf]
  - [leaf2,eth3,core2,eth2,0xf]
  - [leaf3,eth2,core1,eth3,0xf]
  - [leaf3,eth3,core2,eth3,0xf]
vm:
  leaf1:
    type: linuxrouter
    ip_address: 192.168.250.11
    port:
      lo0:
        inet: 10.1.255.1/32
        inet6: fc00:dead:Beef:ffff::1/128
        iso: 49.0001.0001.0001.00
      eth1: 
        bridge: leaf1_ge0
  leaf2:
    type: linuxrouter
    ip_address: 192.168.250.12
    port:
      lo0:
        inet: 10.1.255.2/32
        inet6: fc00:dead:Beef:ffff::2/128
        iso: 49.0001.0001.0002.00
      eth1: 
        bridge: leaf2_ge0
  leaf3:
    type: linuxrouter
    ip_address: 192.168.250.13
    port:
      lo0:
        inet: 10.1.255.3/32
        inet6: fc00:dead:Beef:ffff::3/128
        iso: 49.0001.0001.0003.00
      eth1: 
        bridge: leaf3_ge0
  core1:
    type: linuxrouter
    ip_address: 192.168.250.21
    port:
      lo0:
        inet: 10.1.255.11/32
        inet6: fc00:dead:Beef:ffff::11/128
        iso: 49.0001.0001.0011.00
  core2:
    type: linuxrouter
    ip_address: 192.168.250.22
    port:
      lo0:
        inet: 10.1.255.12/32
        inet6: fc00:dead:Beef:ffff::12/128
        iso: 49.0001.0001.0012.00
