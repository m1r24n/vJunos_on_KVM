---
disk: 
  vjunosrouter: /disk2/vm/images/vJunos-router-26.2R1.7.qcow2
  vjunosswitch: /disk2/vm/images/vJunos-switch-26.2R1.7.qcow2
  # vaoscx: /disk2/vm/images/arubaoscx-disk-image.qcow2
  # sonic: /disk2/vm/images/sonic-vm.qcow2
vm_dir: /disk2/vm/lab15
mgmt:
  bridge: br0
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.100
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [sw1,ge-0/0/0,sw2,ge-0/0/0,0x0]
  - [sw1,ge-0/0/1,sw2,ge-0/0/1,0x0]
vm:
  sw1:
    type: vjunosswitch
    ip_address: 192.168.250.101
    port:
      lo0:
        inet: 10.1.255.1/32
        inet6: fc00:dead:beef:ffff::1/128
        iso: 49.0001.0001.0001.0001.00
      ge-0/0/2: 
        bridge: sw1_ge2
      ge-0/0/3: 
        bridge: sw1_ge3
  sw2:
    type: vjunosswitch
    ip_address: 192.168.250.102
    port:
      lo0:
        inet: 10.1.255.2/32
        inet6: fc00:dead:beef:ffff::2/128
        iso: 49.0001.0001.0001.0002.00
      ge-0/0/2: 
        bridge: sw2_ge2
      ge-0/0/3: 
        bridge: sw2_ge3
lxc:
  c1:
    type: alpine
    port:
      eth0:
        bridge: sw1_ge2
      eth1:
        bridge: sw1_ge3
  c2:
    type: alpine
    port:
      eth0:
        bridge: sw2_ge2
      eth1:
        bridge: sw2_ge3
