---
disk: 
  vjunosrouter: /disk2/vm/images/vJunos-router-26.2R1.7.qcow2
  vjunosswitch: /disk2/vm/images/vJunos-switch-26.2R1.7.qcow2
  # vaoscx: /disk2/vm/images/arubaoscx-disk-image.qcow2
  # sonic: /disk2/vm/images/sonic-vm.qcow2
vm_dir: /disk2/vm/lab13
mgmt:
  bridge: br0
ovs:
- sw1_ge0
- sw2_ge0
junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.254
  option-150: 192.168.250.254
  dns: 192.168.1.1
  range: 
    min: 192.168.250.100
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [sw1,ge-0/0/1,r1,ge-0/0/0,0xf]
  - [sw1,ge-0/0/2,r2,ge-0/0/0,0xf]
  - [sw2,ge-0/0/1,r1,ge-0/0/1,0xf]
  - [sw2,ge-0/0/2,r2,ge-0/0/1,0xf]
  - [r1,ge-0/0/2,r2,ge-0/0/2,0xf]
vm:
  sw1:
    type: vjunosswitch
    ip_address: 192.168.250.101
    port:
      lo0:
        inet: 10.1.255.1/32
        inet6: fc00:dead:beef:ffff::1/128
        iso: 49.0001.0001.0001.0001.00
      ge-0/0/0: 
        bridge: sw1_ge0
  sw2:
    type: vjunosswitch
    ip_address: 192.168.250.102
    port:
      lo0:
        inet: 10.1.255.2/32
        inet6: fc00:dead:beef:ffff::2/128
        iso: 49.0001.0001.0001.0002.00
      ge-0/0/0: 
        bridge: sw2_ge0
  r1:
    type: vjunosrouter
    ip_address: 192.168.250.111
    port:
      lo0:
        inet: 10.1.255.11/32
        inet6: fc00:dead:beef:ffff::11/128
        iso: 49.0001.0001.0001.0011.00
  r2:
    type: vjunosrouter
    ip_address: 192.168.250.112
    port:
      lo0:
        inet: 10.1.255.12/32
        inet6: fc00:dead:beef:ffff::12/128
        iso: 49.0001.0001.0001.0012.00
lxc:
  c1a:
    type: alpine
    port:
      eth0:
        bridge: sw1_ge0
        vlan: 111
        inet: 192.168.111.11/24
        gw4: 192.168.111.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a111::1000:11/64
        gw6: fc00:dead:Beef:a111::1
  c2a:
    type: alpine
    port:
      eth0:
        bridge: sw1_ge0
        vlan: 112
        inet: 192.168.112.11/24
        gw4: 192.168.112.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a112::1000:11/64
        gw6: fc00:dead:Beef:a112::1
  c1b:
    type: alpine
    port:
      eth0:
        bridge: sw2_ge0
        vlan: 121
        inet: 192.168.121.11/24
        gw4: 192.168.121.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a121::1000:11/64
        gw6: fc00:dead:Beef:a121::1
  c2b:
    type: alpine
    port:
      eth0:
        bridge: sw2_ge0
        vlan: 122
        inet: 192.168.122.11/24
        gw4: 192.168.122.1
        dns: 8.8.8.8
        inet6: fc00:dead:beef:a122::1000:11/64
        gw6: fc00:dead:Beef:a122::1
