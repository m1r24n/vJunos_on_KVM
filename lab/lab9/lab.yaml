---
disk: 
  vjunosrouter: /vm/images/vJunos-router-25.4R1.12.qcow2
  vjunosswitch: /vm/images/vJunos-switch-25.4R1.12.qcow2
  vjunosevolved: /vm/images/vJunosEvolved-25.4R1.13-EVO.qcow2
  vaoscx: /vm/images/arubaoscx-disk-image.qcow2
  sonic: /vm/images/sonic-vm.qcow2
  #vjunosevolved: /vm/vjunos/vJunosEvolved-24.2R2.6-EVO.qcow2
  #vjunosevolvedbx: /vm/vjunos/
  # vjunosevolved_config: /disk2/vm/vjunos/vjunosevolved_config.img
vm_dir: /vm/lab9
# cdrom: true
mgmt:
  bridge: br0
ovs:
- r1_et0
- r2_et0
- r3_et0
- r4_et0

junos_login:
  user: admin
  password: pass01
  ssh_key_name: id_rsa
ip_pool:
  subnet: 192.168.250.0/24
  gateway: 192.168.250.1
  option-150: 192.168.250.1
  dns: 192.168.1.1
  range: 
    min: 192.168.250.100
    max: 192.168.250.200
fabric:
  inet_prefix: 10.1.100.0/24
  #ipv6_prefix: fc00:dead:beef:ffff:ffff::/80
  topology:
  - [r1,et-0/0/1,r2,et-0/0/1,0xf]
  - [r1,et-0/0/2,r3,et-0/0/1,0xf]
  - [r4,et-0/0/1,r2,et-0/0/2,0xf]
  - [r4,et-0/0/2,r3,et-0/0/2,0xf]
  - [r1,et-0/0/3,r4,et-0/0/3,0xf]
  - [r2,et-0/0/3,r3,et-0/0/3,0xf]
vm:
  r1:
    type: vjunosevolved
    ip_address: 192.168.250.101
    port:
      lo0:
        inet: 10.1.255.1/32
        inet6: fc00:dead:beef:ffff::1/128
        iso: 49.0001.0001.0001.0001.00
      et-0/0/0: 
        bridge: r1_et0
  r2:
    type: vjunosevolved
    ip_address: 192.168.250.102
    port:
      lo0:
        inet: 10.1.255.2/32
        inet6: fc00:dead:beef:ffff::2/128
        iso: 49.0001.0001.0001.0002.00
      et-0/0/0: 
        bridge: r2_et0
  r3:
    type: vjunosevolved
    ip_address: 192.168.250.103
    port:
      lo0:
        inet: 10.1.255.3/32
        inet6: fc00:dead:beef:ffff::3/128
        iso: 49.0001.0001.0001.0003.00
      et-0/0/0: 
        bridge: r3_et0
  r4:
    type: vjunosevolved
    ip_address: 192.168.250.104
    port:
      lo0:
        inet: 10.1.255.4/32
        inet6: fc00:dead:beef:ffff::4/128
        iso: 49.0001.0001.0001.0004.00
      et-0/0/0: 
        bridge: r4_et0
