forwarding-options {
    tunnel-termination;
}
interfaces {
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address 192.168.250.104/24;
            }
        }
    }
    et-0/0/0 {
        mtu 9000;
        }
    et-0/0/1 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.9/31;
                }
            inet6;
                iso;
                }
        }
        }
    et-0/0/2 {
        mtu 9000;
        unit 0 {
            family {
            inet {
                    address 10.1.100.11/31;
                }
            inet6;
                iso;
                }
        }
        }
    lo0 {
        unit 0 {
            family {
            inet {
                    address 10.1.255.4/32;
                }
            inet6 {
                    address fc00:dead:beef:ffff::4/128;
                }
                iso {
                    address 49.0001.0001.0001.0004.00;
                }
                }
        }
        }
    }
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 192.168.250.1;
            }
        }
    }
}
protocols {
    lldp {
        interface all;
        interface re0:mgmt-0 {
            disable;
        }
        }
    isis {
        level 1 disable;
        level 2 wide-metrics-only;
        
        
        interface et-0/0/1 {
            point-to-point;
        }
        
        interface et-0/0/2 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
        }
    mpls {
        }
    rsvp {
        }
    ldp {
        }
}


